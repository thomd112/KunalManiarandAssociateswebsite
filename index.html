<!DOCTYPE html>
<html>
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
    <meta charset="utf-8">
    <title>Kunal Maniar and Associates</title>
    <link rel="icon" type="image/x-icon" href="logo.png">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            background: #ffffff;
            overflow: hidden;
            width: 100%;
            position: relative;
            font-family: "DM Sans", sans-serif;
            font-optical-sizing: auto;
            font-weight: 400;
            font-style: normal;
        }
        
        /* Loading Screen Styles */
        .loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }
        
        .loading-screen.hidden {
            opacity: 0;
            visibility: hidden;
        }
        
        .loading-text {
            font-family: "DM Sans", sans-serif;
            font-size: 4rem;
            font-weight: 300;
            color: #000000;
            letter-spacing: 0.3em;
            margin-bottom: 2rem;
            animation: fadeInOut 2s ease-in-out infinite;
        }
        
        .loading-time {
            font-family: "DM Sans", sans-serif;
            font-size: 1.2rem;
            font-weight: 400;
            color: #000000;
            letter-spacing: 0.05em;
            opacity: 0.7;
        }
        
        @keyframes fadeInOut {
            0%, 100% { opacity: 1; }
            50% { opacity: 1; }
        }
      
        
        /* Main content styles - hidden initially */
        .main-content {
            opacity: 0;
            transition: opacity 0.8s ease-out;
        }
        
        .main-content.visible {
            opacity: 1;
        }
        
        body {
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        
        .bg-container {
            position: fixed;
            top: 0; left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #ffffff;
        }
        .bg-video {
           position: absolute;
            top: 80px;
            left: 40px;
            right: 40px;
            bottom: 100px;
            width: calc(100vw - 80px);
            height: calc(100vh - 170px);
            object-fit: cover;
            opacity: 0;
            transition: opacity 1.2s cubic-bezier(.77,0,.18,1);
        }

 

        .bg-video.active {
            opacity: 1;
            z-index: 1;
        }
        
        /* Top navigation bar */
        .top-nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 80px;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            
        }
        
        .brand-section {
            display: flex;
            align-items: center;
        }
        
        .brand-logo {
           width: 50px;
            height: 50px;
            object-fit: contain;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .brand-logo:hover {
            transform: scale(1.05);
            opacity: 0.8;
        }
        
        .nav-links {
            display: flex;
            gap: 40px;
            align-items: center;
        }
        
        .nav-links a {
            font-family: "DM Sans", sans-serif;
            color: #000000;
            font-size: 16px;
            font-weight: 400;
            /* letter-spacing: 0.08em; */
            text-decoration: none;
            transition: all 0.2s ease;
            text-transform: capitalize;
            font-weight: 200;
        }
        
        .nav-links a:hover {
            color: #CAD090;
        }

        .volume-control {
            position: fixed;
            bottom: 30px;
            right: 25px;
            z-index: 10;
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.95);
            /* border: 1px solid rgba(0, 0, 0, 0.1); */
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }
        
        .volume-control:hover {
            background: rgba(255, 255, 255, 1);
            transform: scale(1.05);
            /* border-color: rgba(0, 0, 0, 0.2); */
        }
        
        .volume-icon {
            width: 20px;
            height: 20px;
            fill: #000000;
            opacity: 0.8;
            transition: opacity 0.3s ease;
        }
        
        .volume-control:hover .volume-icon {
            opacity: 1;
        }
        
        .caption {
            position: fixed;
            bottom: 30px;
            left: 40px;
            font-family: "DM Sans", sans-serif;
            color: #000000;
            font-size: 16px;
            font-weight: 200;
            text-align: left;
            z-index: 10;
            opacity: 0;
            transition: opacity 1.2s cubic-bezier(.77,0,.18,1);
            text-transform: capitalize;
            display: flex;
            align-items: center;
            height: 50px;
        }

        .caption.active {
            opacity: 1;
        }
        
        .credit-text {
            position: fixed;
            bottom: 120px;
            right: 40px;
            font-family: "DM Sans", sans-serif;
            color: #000000;
            font-size: 16px;
            font-weight: 400;
            /* letter-spacing: 0.08em; */
            text-align: right;
            z-index: 10;
            opacity: 0;
            transition: opacity 1.2s cubic-bezier(.77,0,.18,1);
            text-transform: capitalize;
        }
        
        .credit-text.active {
            opacity: 1;
        }

        /* White overlay to ensure corners are visible */
        .corner-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 0;
            background: #ffffff;
            pointer-events: none;
        }


    </style>
</head>
<body>
    <!-- Loading Screen -->
    <div class="loading-screen" id="loadingScreen">
        <div class="loading-text">KMA<span class="loading-dots"></span></div>
        <div class="loading-time" id="mumbaiTime">Mumbai, IST</div>
    </div>
    
    <!-- Main Content -->
    <div class="main-content" id="mainContent">
        <div class="corner-overlay"></div>
        
        <div class="bg-container">
            <!--
                Only the first video has a src at page load. The other two keep their file in
                data-src and are loaded just before they are shown (saves memory and data on mobile).
                muted + playsinline are required for mobile autoplay.
            -->
            <video src="videos/dua-villa.mp4" class="bg-video active" id="bg1" muted loop autoplay playsinline webkit-playsinline x5-playsinline disablepictureinpicture disableremoteplayback preload="auto"></video>
            <video data-src="videos/forest-house.mp4" class="bg-video" id="bg2" muted loop playsinline webkit-playsinline x5-playsinline disablepictureinpicture disableremoteplayback preload="none"></video>
            <video data-src="videos/bougainvillae-house.mp4" class="bg-video" id="bg3" muted loop playsinline webkit-playsinline x5-playsinline disablepictureinpicture disableremoteplayback preload="none"></video>
        </div>
        
        <div class="top-nav">
            <div class="brand-section">
                <img src="logo.png" class="brand-logo" alt="KMA Logo" id="brandLogo">
            </div>
            
            <div class="nav-links">
                <a href="projects.html">Index</a>
                <a href="press.html">Press</a>
                <a href="contact.html">Contact</a>
            </div>
        </div>
        
        <div class="volume-control" id="volumeBtn">
            <svg class="volume-icon" id="volumeIcon" viewBox="0 0 24 24">
                <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
            </svg>
        </div>
        
        <!-- <div class="credit-text" id="creditText">Videography By Sohaib Ilyas</div> -->
        
        <div class="caption active" id="caption1">Dua villa</div>
        <div class="caption" id="caption2">Forest house</div>
        <div class="caption" id="caption3">Bougainvillae house</div>
    </div>

    <!--
        MOBILE ONLY: on phones (screen width 768px or less) the videos are replaced
        with still images. Desktop keeps the videos exactly as before.
        This block must stay ABOVE the main script below.
    -->
    <script>
        if (window.matchMedia('(max-width: 768px)').matches) {
            const mobileImages = {
                bg1: 'duavilla.jpg',
                bg2: 'foresthouseone.jpg',
                bg3: 'bhouse.jpg'
            };

            Object.keys(mobileImages).forEach(function (id) {
                const oldVideo = document.getElementById(id);

                // Stop the video from downloading at all
                oldVideo.pause();
                oldVideo.removeAttribute('src');
                oldVideo.removeAttribute('data-src');
                oldVideo.load();

                const img = document.createElement('img');
                img.id = id;
                img.className = oldVideo.className;   // keeps the same size, position and fade
                img.src = mobileImages[id];
                img.alt = '';

                // Lets the existing slideshow code run without errors
                img.play = function () { return Promise.resolve(); };
                img.pause = function () {};
                img.load = function () {};

                oldVideo.replaceWith(img);
            });

            // No sound on images, so hide the volume button
            document.getElementById('volumeBtn').style.display = 'none';
        }
    </script>
    
    <script>
        // Update Mumbai time function
        function updateMumbaiTime() {
            const now = new Date();
            const mumbaiTime = new Date(now.toLocaleString("en-US", {timeZone: "Asia/Kolkata"}));
            const timeString = mumbaiTime.toLocaleTimeString('en-US', {
                hour12: true,
                hour: '2-digit',
                minute: '2-digit'
            });
            document.getElementById('mumbaiTime').textContent = `${timeString} Mumbai, IST`;
        }
        
        // Update time every second during loading
        const timeInterval = setInterval(updateMumbaiTime, 1000);
        updateMumbaiTime(); // Initial call

        // Loading screen functionality
        // On mobile the window "load" event can be very slow (or never fire) while video
        // is downloading, so we also start on a fallback timer. startSite() only runs once.
        let siteStarted = false;
        function startSite() {
            if (siteStarted) return;
            siteStarted = true;

            // Clear time interval
            clearInterval(timeInterval);

            // Hide loading screen
            document.getElementById('loadingScreen').classList.add('hidden');

            // Show main content
            setTimeout(function() {
                document.getElementById('mainContent').classList.add('visible');

                // Initialize main functionality after content is visible
                initializeMainContent();
            }, 400);
        }

        window.addEventListener('load', function() {
            setTimeout(startSite, 1200); // minimum loading screen time
        });
        // Fallback in case "load" is delayed by large video files on mobile
        setTimeout(startSite, 4000);
        
        function initializeMainContent() {
            // Brand logo click functionality - goes to homepage
            const brandLogo = document.getElementById('brandLogo');
            brandLogo.addEventListener('click', function() {
                // Reload the current page (homepage)
                window.location.reload();
            });
            
            // Credit text animation (guarded: the element is commented out in the HTML)
            const creditText = document.getElementById('creditText');
            if (creditText) {
                setTimeout(() => {
                    creditText.classList.add('active');
                }, 1000);
                
                setTimeout(() => {
                    creditText.classList.remove('active');
                }, 5000);
            }

            // Automatic video transitions every 10 seconds (infinite loop)
            let currentIndex = 0;
            let isMuted = true;
            const videos = [
                document.getElementById('bg1'),
                document.getElementById('bg2'),
                document.getElementById('bg3')
            ];
            const captions = [
                document.getElementById('caption1'),
                document.getElementById('caption2'),
                document.getElementById('caption3')
            ];
            const volumeBtn = document.getElementById('volumeBtn');
            const volumeIcon = document.getElementById('volumeIcon');

            // Force inline + muted at the property level (mobile requirement for autoplay)
            videos.forEach(v => {
                v.muted = true;
                v.defaultMuted = true;
                v.setAttribute('muted', '');
                v.setAttribute('playsinline', '');
                v.setAttribute('webkit-playsinline', '');
            });

            // Load a video's file only when it is needed (videos 2 and 3 start with no src)
            function ensureLoaded(video) {
                if (!video.getAttribute('src') && video.dataset.src) {
                    video.setAttribute('src', video.dataset.src);
                    video.load();
                }
            }

            // Play helper: never throws, retries once if the first attempt is rejected
            function safePlay(video) {
                ensureLoaded(video);
                video.muted = isMuted;
                const attempt = video.play();
                if (attempt && typeof attempt.catch === 'function') {
                    attempt.catch(() => {
                        setTimeout(() => {
                            const retry = video.play();
                            if (retry && typeof retry.catch === 'function') retry.catch(() => {});
                        }, 500);
                    });
                }
            }

            // Fallback: if the browser blocked autoplay (Low Power Mode, data saver, etc.),
            // the first tap/touch anywhere starts the current video.
            ['touchstart', 'touchend', 'click'].forEach(evt => {
                document.addEventListener(evt, () => {
                    safePlay(videos[currentIndex]);
                }, { once: true, passive: true });
            });

            // Resume the current video if the tab/app comes back to the foreground
            document.addEventListener('visibilitychange', () => {
                if (!document.hidden) safePlay(videos[currentIndex]);
            });

            // Volume control functionality
            volumeBtn.addEventListener('click', function() {
                isMuted = !isMuted;
                videos.forEach(video => {
                    video.muted = isMuted;
                });
                // Update icon based on mute state (reversed)
                if (isMuted) {
                    volumeIcon.innerHTML = '<path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM19 12c0 2.53-1.5 4.71-3.66 5.73l-.77-1.39c1.66-.85 2.43-2.64 2.43-4.34s-.77-3.49-2.43-4.34l.77-1.39c2.16 1.02 3.66 3.2 3.66 5.73zm-10.5 5L3 12.5v-1L8.5 7H12v10H8.5z"/><path d="M7 9H3v6h4l5 5V4l-5 5z"/>';
                } else {
                    volumeIcon.innerHTML = '<path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>';
                }
            });

            // Log errors so they can be seen in a remote debugger (helps diagnose codec/server issues)
            videos.forEach((video, index) => {
                video.addEventListener('error', () => {
                    const err = video.error;
                    console.warn('Video ' + (index + 1) + ' failed to load.',
                        err ? 'code ' + err.code : '');
                });
                video.addEventListener('ended', () => {
                    video.currentTime = 0;
                    safePlay(video);
                });
            });

            function switchToNextVideo() {
                const nextIndex = (currentIndex + 1) % videos.length;

                // Prepare next video (loads its file if it hasn't been loaded yet)
                safePlay(videos[nextIndex]);

                // Fade out current video and caption
                videos[currentIndex].classList.remove('active');
                captions[currentIndex].classList.remove('active');

                // Fade in next video and caption after a short delay for smoothness
                setTimeout(() => {
                    videos[nextIndex].classList.add('active');
                    captions[nextIndex].classList.add('active');
                    currentIndex = nextIndex;
                }, 400); // 400ms delay for smoother transition
            }

            // Start the first video right away, then begin loading the second quietly
            safePlay(videos[0]);
            videos[0].addEventListener('loadeddata', () => safePlay(videos[0]), { once: true });
            videos[0].addEventListener('canplay', () => safePlay(videos[0]), { once: true });

            // Start the automatic slideshow after a brief delay
            setTimeout(() => {
                setInterval(switchToNextVideo, 10000);
            }, 500);
        }
    </script>
</body>
</html>
